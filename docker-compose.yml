services:
  backend:
    build:
      context: .
    container_name: borc-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: borc-cloudflared
    restart: unless-stopped
    command: tunnel --url http://backend:8000
    depends_on:
      - backend